services:
  m3u-mirror:
    build: https://github.com/cumtwjq/iptv-subscriptions.git#main:nas
    image: iptv-subscriptions-mirror:latest
    pull_policy: build
    restart: unless-stopped
    environment:
      # Example: https://YOUR_USERNAME.github.io/YOUR_REPOSITORY
      PAGES_BASE: https://cumtwjq.github.io/iptv-subscriptions
      REFRESH_SECONDS: 1800
    ports:
      - "8098:8098"
    volumes:
      - ./cache:/data
