name: Sync selected M3U files

on:
  push:
    paths:
      - nas/server.py
      - sync.py
      - README.md
      - site-index.html
      - sources.json
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: m3u-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download selected playlists
        run: python sync.py
      - name: Commit changed playlists
        id: changes
        run: |
          git add -A m3u/
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update mirrored M3U playlists"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Prepare Pages site
        if: steps.changes.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir -p site
          cp m3u/*.m3u site/
          cp sources.json site/sources.json
          cp nas/server.py site/nas-server.py
          cp site-index.html site/index.html
      - uses: actions/configure-pages@v5
        if: steps.changes.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.changes.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.changes.outputs.changed == 'true' || github.event_name != 'schedule'
